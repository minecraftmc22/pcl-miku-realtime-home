name: Update PCL homepage

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate current XAML
        run: python realtime_home_server.py --once --output Custom.xaml

      - name: Commit updated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Custom.xaml Custom.xaml.ini
          git diff --cached --quiet || git commit -m "Update live Minecraft status and news"
          git push
